<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machine Status Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .stat-card {
            background: white;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            min-width: 150px;
        }
        
        .stat-card .number {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-card .label {
            color: #666;
            font-size: 0.9rem;
            margin-top: 5px;
        }
        
        .machines-grid {
            display: grid;
            grid-template-columns: repeat(6, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            justify-content: center;
            max-width: 1800px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .machine-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .machine-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        
        .machine-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        
        .machine-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
        }
        
        .status-indicator {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: inline-block;
            position: relative;
        }
        
        .status-indicator.up {
            background-color: #10b981;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }
        
        .status-indicator.down {
            background-color: #ef4444;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }
        
        .status-indicator::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 50%;
            border: 2px solid currentColor;
            opacity: 0;
            animation: pulse 2s infinite;
        }
        
        .status-indicator.up::after {
            color: #10b981;
        }
        
        .status-indicator.down::after {
            color: #ef4444;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        
        .status-text {
            font-weight: 600;
            margin-left: 8px;
        }
        
        .status-text.up {
            color: #10b981;
        }
        
        .status-text.down {
            color: #ef4444;
        }
        
        .machine-details {
            font-size: 0.9rem;
            color: #666;
            line-height: 1.6;
        }
        
        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .detail-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        
        .detail-label {
            font-weight: 500;
            color: #888;
        }
        
        .detail-value {
            font-family: monospace;
            color: #333;
        }
        
        .uptime-bar {
            width: 100%;
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }
        
        .uptime-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #34d399);
            transition: width 0.5s ease;
        }
        
        .last-check {
            font-size: 0.8rem;
            color: #999;
            margin-top: 10px;
            text-align: right;
        }
        
        .refresh-indicator {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        .refresh-indicator .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            margin: 0 2px;
            animation: blink 1.4s infinite both;
        }
        
        .refresh-indicator .dot:nth-child(2) { animation-delay: 0.2s; }
        .refresh-indicator .dot:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes blink {
            0%, 80%, 100% { opacity: 0; }
            40% { opacity: 1; }
        }
        
        .loading {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🖥️ Machine Status Monitor</h1>
            <p>Real-time monitoring of PPD machines</p>
        </header>
        
        <div class="stats">
            <div class="stat-card">
                <div class="number" id="total-machines">0</div>
                <div class="label">Total Machines</div>
            </div>
            <div class="stat-card">
                <div class="number" id="up-machines" style="color: #10b981;">0</div>
                <div class="label">Online</div>
            </div>
            <div class="stat-card">
                <div class="number" id="down-machines" style="color: #ef4444;">0</div>
                <div class="label">Offline</div>
            </div>
            <div class="stat-card">
                <div class="number" id="uptime-percent">0%</div>
                <div class="label">Uptime</div>
            </div>
        </div>
        
        <div id="machines-container" class="machines-grid">
            <div class="loading">Loading machine status...</div>
        </div>
        
        <div class="refresh-indicator">
            Auto-refreshing every 5 seconds <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
    </div>
    
    <script>
        let machineData = {};
        
        function formatDuration(seconds) {
            if (seconds < 60) return `${seconds}s`;
            const mins = Math.floor(seconds / 60);
            if (mins < 60) return `${mins}m ${seconds % 60}s`;
            const hours = Math.floor(mins / 60);
            if (hours < 24) return `${hours}h ${mins % 60}m`;
            const days = Math.floor(hours / 24);
            return `${days}d ${hours % 24}h`;
        }
        
        function formatLastCheck(isoString) {
            if (!isoString) return 'Never';
            const date = new Date(isoString);
            const now = new Date();
            const diff = Math.floor((now - date) / 1000);
            if (diff < 60) return `${diff}s ago`;
            if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
            if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
            return date.toLocaleString();
        }
        
        function updateStats(data) {
            const total = data.length;
            const up = data.filter(m => m.is_up).length;
            const down = total - up;
            const uptime = total > 0 ? Math.round((up / total) * 100) : 0;
            
            document.getElementById('total-machines').textContent = total;
            document.getElementById('up-machines').textContent = up;
            document.getElementById('down-machines').textContent = down;
            document.getElementById('uptime-percent').textContent = uptime + '%';
        }
        
        function createMachineCard(machine) {
            const isUp = machine.is_up;
            const duration = isUp ? machine.up_duration_seconds : machine.down_duration_seconds;
            const durationLabel = isUp ? 'Up for' : 'Down for';
            const latency = machine.latency_ms ? `${machine.latency_ms.toFixed(1)}ms` : 'N/A';
            const displayName = machine.description || machine.host;
            
            return `
                <div class="machine-card">
                    <div class="machine-header">
                        <div class="machine-name">${displayName}</div>
                        <div>
                            <span class="status-indicator ${isUp ? 'up' : 'down'}"></span>
                            <span class="status-text ${isUp ? 'up' : 'down'}">${isUp ? 'UP' : 'DOWN'}</span>
                        </div>
                    </div>
                    <div class="machine-details">
                        <div class="detail-row">
                            <span class="detail-label">${durationLabel}</span>
                            <span class="detail-value">${formatDuration(duration || 0)}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Latency</span>
                            <span class="detail-value">${latency}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Last Check</span>
                            <span class="detail-value">${formatLastCheck(machine.last_check)}</span>
                        </div>
                        <div class="uptime-bar">
                            <div class="uptime-fill" style="width: ${isUp ? 100 : 0}%"></div>
                        </div>
                    </div>
                </div>
            `;
        }
        
        async function fetchStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                updateStats(data);
                
                const container = document.getElementById('machines-container');
                container.innerHTML = data
                    .sort((a, b) => a.host.localeCompare(b.host))
                    .map(machine => createMachineCard(machine))
                    .join('');
                
                // Store for comparison
                machineData = data.reduce((acc, m) => {
                    acc[m.host] = m;
                    return acc;
                }, {});
                
            } catch (error) {
                console.error('Error fetching status:', error);
                document.getElementById('machines-container').innerHTML = 
                    '<div class="loading">Error loading data. Retrying...</div>';
            }
        }
        
        // Initial load
        fetchStatus();
        
        // Auto-refresh every 5 seconds
        setInterval(fetchStatus, 5000);
        
        // Also refresh on visibility change
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                fetchStatus();
            }
        });
    </script>
</body>
</html>
